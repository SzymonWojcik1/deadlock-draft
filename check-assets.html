<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Asset Check</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  body{ margin:0; padding:24px; background:#0A0A0F; color:#EDE7D9; font-family:'IBM Plex Sans',sans-serif; }
  h1{ font-size:20px; margin:0 0 4px; }
  .sub{ color:#9C9484; font-size:13px; margin-bottom:20px; max-width:620px; line-height:1.5; }
  .summary{ margin-bottom:18px; font-family:'IBM Plex Mono'; font-size:13px; }
  .ok{ color:#7FBF7F; }
  .bad{ color:#D96A78; }
  table{ border-collapse:collapse; width:100%; max-width:820px; }
  th,td{ text-align:left; padding:6px 10px; border-bottom:1px solid rgba(237,231,217,.08); font-size:13px; }
  th{ color:#9C9484; font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.06em; }
  td.id{ font-family:'IBM Plex Mono'; color:#E3A857; width:56px; }
  td.slug{ font-family:'IBM Plex Mono'; color:#9C9484; font-size:12px; }
  .cell{ font-family:'IBM Plex Mono'; font-size:14px; }
  img.pv{ width:30px; height:30px; object-fit:cover; border-radius:3px; background:#14141A; }
</style>
</head>
<body>

<h1>Asset Check</h1>
<div class="sub">
  Loads <code>data/heroes.json</code> and tries to fetch every art file for
  every hero, in every folder. Red cells are missing files — either the hero
  has no art yet, or the filename doesn't match its <code>slug</code>.
</div>

<div class="summary" id="summary">Checking…</div>

<table>
  <thead><tr id="head"></tr></thead>
  <tbody id="rows"></tbody>
</table>

<script type="module">
import { loadHeroes, allHeroes, heroAsset } from "./js/heroes.js";
import { ASSETS } from "./js/config.js";

const TYPES = Object.keys(ASSETS);

function exists(url){
  return new Promise(resolve => {
    if (url.endsWith(".svg")){
      // <img> won't reliably error on some SVGs; use fetch instead.
      fetch(url, { method: "HEAD" })
        .then(r => resolve(r.ok))
        .catch(() => resolve(false));
      return;
    }
    const img = new Image();
    img.onload  = () => resolve(true);
    img.onerror = () => resolve(false);
    img.src = url;
  });
}

async function run(){
  await loadHeroes();
  const heroes = allHeroes();

  document.getElementById("head").innerHTML =
    `<th>ID</th><th></th><th>Hero</th><th>Slug</th>` +
    TYPES.map(t => `<th>${t}</th>`).join("");

  const tbody = document.getElementById("rows");
  let missing = 0;

  for (const hero of heroes){
    const tr = document.createElement("tr");

    const results = await Promise.all(
      TYPES.map(type => exists(heroAsset(hero, type)))
    );

    const portraitIdx = TYPES.indexOf("portrait");
    const portraitUrl = heroAsset(hero, "portrait");

    tr.innerHTML =
      `<td class="id">${hero.id}</td>` +
      `<td>${results[portraitIdx] ? `<img class="pv" src="${portraitUrl}">` : ""}</td>` +
      `<td>${hero.name}</td>` +
      `<td class="slug">${hero.slug}</td>` +
      results.map(ok => {
        if (!ok) missing++;
        return `<td class="cell ${ok ? "ok" : "bad"}">${ok ? "✓" : "✕"}</td>`;
      }).join("");

    tbody.appendChild(tr);
  }

  const total = heroes.length * TYPES.length;
  document.getElementById("summary").innerHTML =
    `${heroes.length} heroes × ${TYPES.length} art types = ${total} files · ` +
    (missing
      ? `<span class="bad">${missing} missing</span>`
      : `<span class="ok">all present</span>`);
}

run().catch(err => {
  document.getElementById("summary").innerHTML =
    `<span class="bad">${err.message}</span>`;
});
</script>
</body>
</html>
